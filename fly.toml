# Déploiement du serveur arbitre chez Fly.io.
#
# Pourquoi Fly plutôt qu'un hébergeur gratuit : le temps réel de la partie
# passe par une connexion permanente (Socket.IO). Les offres gratuites la
# coupent, ou ne l'ouvrent pas du tout — la carte se chargerait, mais plus
# personne n'y bougerait. Voir docs/HEBERGEMENT.md.
#
#   fly launch --no-deploy     (une fois, crée l'application)
#   fly secrets set DATABASE_URL="…" SUPABASE_URL="…"
#   fly deploy

app = 'carto-airsoft-api'
primary_region = 'cdg'

[build]
  dockerfile = 'apps/api/Dockerfile'

# Les migrations tournent AVANT la bascule : une version déployée contre un
# schéma qu'elle ne connaît pas échouerait à la première requête.
[deploy]
  release_command = 'npx drizzle-kit migrate'

[env]
  PORT = '3000'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  # La machine ne s'éteint pas : une partie en cours ne supporte pas un
  # réveil d'une minute, et les connexions permanentes ne survivent pas à
  # une mise en veille.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
