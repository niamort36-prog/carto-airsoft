# Android et iOS avancent ensemble ou pas du tout.
#
# Le code Flutter est commun aux deux, mais ce n'est pas ce qui les fait
# diverger : ce sont les réglages de plateforme, les permissions et les
# greffons. Construire les deux à chaque poussée est le seul moyen de
# s'apercevoir le jour même qu'iOS ne compile plus — au lieu de le
# découvrir le matin d'une partie.
name: Mobile

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  qualite:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Analyse statique
        run: flutter analyze
        working-directory: apps/mobile
      - name: Tests
        run: flutter test
        working-directory: apps/mobile

  # Android, iOS et web sortent du MEME code Dart : leurs fonctions ne
  # peuvent pas diverger. Ce qui peut diverger, c'est la configuration de
  # plateforme — et un numero de version fige a la main est la facon la plus
  # discrete de livrer trois applications qui se croient differentes.
  parite:
    name: Parité des trois cibles
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Une seule source de version
        run: |
          set -e
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          echo "pubspec : $VERSION"

          grep -q 'versionCode = flutter.versionCode'             android/app/build.gradle.kts             || { echo "::error::Android fige son versionCode au lieu de lire celui de Flutter"; exit 1; }
          grep -q 'versionName = flutter.versionName'             android/app/build.gradle.kts             || { echo "::error::Android fige son versionName au lieu de lire celui de Flutter"; exit 1; }
          grep -q 'FLUTTER_BUILD_NAME' ios/Runner/Info.plist             || { echo "::error::iOS fige sa version au lieu de lire celle de Flutter"; exit 1; }
          grep -q 'FLUTTER_BUILD_NUMBER' ios/Runner/Info.plist             || { echo "::error::iOS fige son numero de build"; exit 1; }
          echo "Les trois cibles lisent la même version."
        working-directory: apps/mobile
      - name: Recenser les écarts de plateforme assumés
        run: |
          set -e
          echo "Branches propres à une plateforme (doivent rester rares et"
          echo "commentées — chacune est une fonction qui diffère quelque part) :"
          grep -rn 'defaultTargetPlatform ==\|kIsWeb' lib/ || true
        working-directory: apps/mobile

  android:
    name: Android (APK)
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build apk --release
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: carto-airsoft-android
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (sans signature)
    needs: qualite
    # Seul un runner macOS peut compiler pour iOS ; c'est la contrainte qui
    # justifie ce job séparé.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Dépendances CocoaPods
        run: pod install
        working-directory: apps/mobile/ios
      # Sans signature : la CI vérifie que le code compile et que les
      # greffons s'installent. La signature et l'envoi à TestFlight
      # demandent des secrets et se font à part.
      - run: flutter build ios --release --no-codesign
        working-directory: apps/mobile
      - name: Vérifier les déclarations exigées par iOS
        run: |
          set -e
          PLIST=Runner/Info.plist
          for cle in NSLocationWhenInUseUsageDescription \
                     NSLocationAlwaysAndWhenInUseUsageDescription \
                     NSCameraUsageDescription \
                     UIBackgroundModes; do
            /usr/libexec/PlistBuddy -c "Print :$cle" "$PLIST" > /dev/null \
              || { echo "::error::$cle manquante dans Info.plist"; exit 1; }
          done
          echo "Déclarations présentes."
        working-directory: apps/mobile/ios
      # Empaqueté en .ipa : c'est le format qu'un outil de sideload
      # (Sideloadly, AltStore) sait signer avec un Apple ID GRATUIT et poser
      # sur un iPhone — depuis Windows, sans Mac et sans les 99 €/an. Le
      # .app brut, lui, ne s'installe nulle part.
      - name: Empaqueter un .ipa non signé
        run: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry ../../../carto-airsoft-unsigned.ipa Payload
          cd ../../..
          ls -lh carto-airsoft-unsigned.ipa
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: carto-airsoft-ios-non-signe
          path: apps/mobile/carto-airsoft-unsigned.ipa

  web:
    name: Web
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build web --release
        working-directory: apps/mobile
      - name: Vérifier ce dont la version navigateur dépend
        run: |
          set -e
          # La base locale exige ces deux fichiers : absents, l'application
          # démarre puis échoue à la première écriture.
          for f in sqlite3.wasm drift_worker.js; do
            test -s "build/web/$f" || { echo "::error::$f manquant dans build/web"; exit 1; }
          done
          # Sans la bibliothèque de carte, l'écran principal reste vide.
          grep -q 'maplibre-gl.js' build/web/index.html             || { echo "::error::maplibre-gl absent de index.html"; exit 1; }
          echo "Dépendances du web présentes."
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: carto-airsoft-web
          path: apps/mobile/build/web

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test --workspace apps/api
