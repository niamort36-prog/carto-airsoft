# Android et iOS avancent ensemble ou pas du tout.
#
# Le code Flutter est commun aux deux, mais ce n'est pas ce qui les fait
# diverger : ce sont les réglages de plateforme, les permissions et les
# greffons. Construire les deux à chaque poussée est le seul moyen de
# s'apercevoir le jour même qu'iOS ne compile plus — au lieu de le
# découvrir le matin d'une partie.
name: Mobile

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  qualite:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Analyse statique
        run: flutter analyze
        working-directory: apps/mobile
      - name: Tests
        run: flutter test
        working-directory: apps/mobile

  android:
    name: Android (APK)
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter build apk --release
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: carto-airsoft-android
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (sans signature)
    needs: qualite
    # Seul un runner macOS peut compiler pour iOS ; c'est la contrainte qui
    # justifie ce job séparé.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Dépendances CocoaPods
        run: pod install
        working-directory: apps/mobile/ios
      # Sans signature : la CI vérifie que le code compile et que les
      # greffons s'installent. La signature et l'envoi à TestFlight
      # demandent des secrets et se font à part.
      - run: flutter build ios --release --no-codesign
        working-directory: apps/mobile
      - name: Vérifier les déclarations exigées par iOS
        run: |
          set -e
          PLIST=Runner/Info.plist
          for cle in NSLocationWhenInUseUsageDescription \
                     NSLocationAlwaysAndWhenInUseUsageDescription \
                     NSCameraUsageDescription \
                     UIBackgroundModes; do
            /usr/libexec/PlistBuddy -c "Print :$cle" "$PLIST" > /dev/null \
              || { echo "::error::$cle manquante dans Info.plist"; exit 1; }
          done
          echo "Déclarations présentes."
        working-directory: apps/mobile/ios
      - uses: actions/upload-artifact@v4
        with:
          name: carto-airsoft-ios
          path: apps/mobile/build/ios/iphoneos/Runner.app

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test --workspace apps/api
