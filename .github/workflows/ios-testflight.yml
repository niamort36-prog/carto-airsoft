# Construction signée et envoi à TestFlight.
#
# Ce workflow est INERTE tant que les secrets ne sont pas renseignés : il
# s'arrête proprement au premier contrôle plutôt que d'échouer bruyamment à
# chaque poussée. Il ne se déclenche jamais tout seul non plus — publier est
# une décision, pas un effet de bord d'un commit.
#
# La voie gratuite (un .ipa non signé posé sur son propre iPhone avec un
# Apple ID sans abonnement) n'a besoin de RIEN de tout ceci : elle est dans
# le job iOS de `mobile.yml`. Voir docs/IOS.md.
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: '3.44.7'
  BUNDLE_ID: com.cartoairsoft.cartoAirsoft

jobs:
  testflight:
    name: Signer et envoyer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Un secret manquant doit se dire en une ligne claire, pas se
      # découvrir trois étapes plus loin dans une erreur de `security`.
      - name: Vérifier que le compte Apple est configuré
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -e
          manquants=""
          for nom in CERT CERT_PASSWORD PROFILE PROFILE_NAME TEAM_ID \
                     KEY_ID ISSUER_ID PRIVATE_KEY; do
            [ -n "${!nom}" ] || manquants="$manquants $nom"
          done
          if [ -n "$manquants" ]; then
            echo "::error::Secrets manquants :$manquants"
            echo "Renseignez-les dans Settings → Secrets and variables →"
            echo "Actions. Voir docs/IOS.md, section « La voie payante »."
            exit 1
          fi
          echo "Tous les secrets sont là."

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile

      # Le certificat vit dans un trousseau JETABLE, propre à ce build : il
      # disparaît avec la machine, et une fuite ne survit pas au job.
      - name: Installer le certificat de signature
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          TROUSSEAU="$RUNNER_TEMP/signature.keychain-db"
          MOT_DE_PASSE="$(uuidgen)"
          echo "TROUSSEAU=$TROUSSEAU" >> "$GITHUB_ENV"
          security create-keychain -p "$MOT_DE_PASSE" "$TROUSSEAU"
          security set-keychain-settings -lut 21600 "$TROUSSEAU"
          security unlock-keychain -p "$MOT_DE_PASSE" "$TROUSSEAU"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/certificat.p12"
          security import "$RUNNER_TEMP/certificat.p12" \
            -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$TROUSSEAU"
          # Sans cette ligne, `codesign` réclame une confirmation
          # graphique — et se bloque pour toujours sur un runner.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$MOT_DE_PASSE" "$TROUSSEAU" > /dev/null
          security list-keychain -d user -s "$TROUSSEAU"
          rm -f "$RUNNER_TEMP/certificat.p12"

      - name: Installer le profil de provisionnement
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -e
          DOSSIER="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DOSSIER"
          echo "$PROFILE" | base64 --decode > "$DOSSIER/build.mobileprovision"

      - name: Composer les options d'export
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -e
          sed -e "s/__TEAM_ID__/$TEAM_ID/" \
              -e "s/__PROFILE_NAME__/$PROFILE_NAME/" \
              ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
        working-directory: apps/mobile

      - name: Dépendances CocoaPods
        run: pod install
        working-directory: apps/mobile/ios

      # Le numéro de build doit monter à chaque envoi : App Store Connect
      # refuse deux fois le même. Celui du dépôt (pubspec) sert de version
      # affichée, le compteur de la CI sert de numéro de build.
      - name: Construire l'archive signée
        run: |
          set -e
          flutter build ipa --release \
            --build-number "${{ github.run_number }}" \
            --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"
          ls -lh build/ios/ipa/*.ipa
        working-directory: apps/mobile

      - name: Envoyer à TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p "$HOME/private_keys"
          echo "$PRIVATE_KEY" > "$HOME/private_keys/AuthKey_$KEY_ID.p8"
          xcrun altool --upload-app -t ios \
            -f "$(ls build/ios/ipa/*.ipa | head -1)" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -f "$HOME/private_keys/AuthKey_$KEY_ID.p8"
        working-directory: apps/mobile

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: carto-airsoft-ios-signe
          path: apps/mobile/build/ios/ipa/*.ipa

      # Même si le build échoue : on ne laisse pas un trousseau contenant un
      # certificat de signature traîner sur la machine.
      - name: Détruire le trousseau
        if: always()
        run: security delete-keychain "$TROUSSEAU" || true
