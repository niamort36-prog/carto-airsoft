<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Carte tactique temps réel pour l’airsoft — version navigateur.">
  <!-- La carte occupe l'écran : on empêche le double-tap de zoomer la page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carto Airsoft">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Carto Airsoft</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Moteur cartographique du navigateur. Sur Android et iOS, MapLibre est
    compilé dans l'application ; sur le web, c'est cette bibliothèque qui
    dessine la carte, et elle doit être chargée ici. La version suit celle
    attendue par le greffon `maplibre_gl` — les deux se tiennent.
  -->
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet"/>

  <style>
    /* Écran d'attente : le démarrage d'une application Flutter web prend
       une seconde ou deux, une page blanche laisserait croire à une panne. */
    body { margin: 0; background: #101410; }
    #amorcage {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      color: #cfd8cf; font-family: system-ui, sans-serif;
    }
    #amorcage .titre { font-size: 20px; letter-spacing: 2px; }
    #amorcage .trait {
      width: 160px; height: 3px; background: #2a3a2a; overflow: hidden;
      border-radius: 2px;
    }
    #amorcage .trait span {
      display: block; width: 40%; height: 100%; background: #6abf69;
      animation: va-et-vient 1.1s ease-in-out infinite;
    }
    @keyframes va-et-vient {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="amorcage">
    <div class="titre">CARTO AIRSOFT</div>
    <div class="trait"><span></span></div>
  </div>

  <script>
    // Retiré dès que Flutter a pris la main.
    window.addEventListener('flutter-first-frame', function () {
      var e = document.getElementById('amorcage');
      if (e) e.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
